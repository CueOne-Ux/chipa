services:
  - type: web
    name: troli-companion
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # Set this manually in the Render dashboard
      - key: PYTHON_VERSION
        value: "3.13.3"
    healthCheckPath: /health
